# One compose file for the whole Jetson stack (AGX Orin 64 GB, L4T R39).
#
#   docker compose up -d vlm viz                    # VLM + graph viewer (always-on)
#   docker compose run --rm so101                   # one SO-101 colour-sort episode, GUI on the Jetson desktop
#   SEED=3 ORDER=yellow,blue,green,red docker compose run --rm so101
#   docker compose down
#
# Prerequisite: ./jetson/install.sh on the host (venvs, skill bundles, model caches).
# The containers mount those host paths unchanged, so nothing is downloaded or rebuilt at `up`.
#
# Memory (Orin 62 GB): vlm ~32 GB, so101 episode (sim + SAM3 + DINO) ~15 GB.
#
# Ports (host network): 8080 VLM, 9432 graph viewer (127.0.0.1; tunnel it:
# ssh -N -L 9432:127.0.0.1:9432 atlas@<jetson>).

x-gap: &gap
  build: { context: jetson/docker }
  image: so101-gap-runtime:latest
  runtime: nvidia
  network_mode: host
  ipc: host
  user: "${UID:-2002}:${GID:-2002}"
  working_dir: ${PWD}
  environment:
    HOME: ${HOME}
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all
  volumes:
    - ${HOME}:${HOME}            # venvs' uv-managed Python, ~/.cache
    - /mnt/ssd:/mnt/ssd          # ~/workspace and ~/.cache/huggingface live on the SSD
    - /tmp:/tmp
    - /etc/passwd:/etc/passwd:ro   # torch/triton call getpwuid() for the host uid
    - /etc/group:/etc/group:ro
    - /etc/localtime:/etc/localtime:ro

services:
  vlm:
    image: ghcr.io/nvidia-ai-iot/llama_cpp:latest-jetson-orin
    container_name: nemotron-omni
    runtime: nvidia
    network_mode: host
    restart: unless-stopped
    volumes:
      - ${LLAMA_CACHE:-${HOME}/workspace/llama-cache}:/root/.cache/huggingface
    command: >
      llama-server -hf ggml-org/NVIDIA-Nemotron-3-Nano-Omni-30B-A3B-GGUF:Q4_K_M
      --ctx-size 32768 --port 8080 --host 0.0.0.0 --alias my_model --n-gpu-layers 999
      --jinja --chat-template-kwargs '{"enable_thinking":false}'

  viz:
    <<: *gap
    restart: unless-stopped
    command: ["jetson/run_viz.sh"]

  so101:
    <<: *gap
    profiles: ["so101"]
    environment:
      HOME: ${HOME}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      DISPLAY: ${DISPLAY:-:1}
      XAUTHORITY: /run/user/${UID:-2002}/gdm/Xauthority
    volumes:
      - ${HOME}:${HOME}
      - /mnt/ssd:/mnt/ssd
      - /tmp:/tmp                      # includes /tmp/.X11-unix for the GUI
      - /run/user/${UID:-2002}/gdm:/run/user/${UID:-2002}/gdm:ro
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
    command: ["bash", "-c", "jetson/run_demo.sh --seed ${SEED:-0} --order ${ORDER:-red,green,blue,yellow} ${GUI---gui}"]

