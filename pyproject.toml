[project]
name = "so101-gap"
version = "0.1.0"
description = "Graph-as-Policy x LeRobot SO-101 on NVIDIA Jetson AGX Orin: colour-cube sorting with a typed skill graph (perception, VLM, IK, MuJoCo sim) on one Orin"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kabilan KB", email = "kabilankb2003@gmail.com" }]
keywords = ["jetson-agx-orin", "nvidia-jetson", "robotics", "so101", "lerobot", "mujoco", "graph-as-policy", "jetson", "vlm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# graph-as-policy (+ graph-as-policy-core) and open-robot-skills are installed
# from pinned sibling checkouts by jetson/install.sh with --no-deps: this demo
# needs none of GaP's LIBERO / robosuite / cuRobo sim stack. These are the
# runtime dependencies it does use.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "httpx>=0.27",
  "requests",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "imageio[ffmpeg]>=2.31",
  "matplotlib>=3.8",
  "networkx>=3",
  "trimesh",
  "msgpack>=1.0",
  "msgpack-numpy>=0.4.8",
  "fastapi>=0.115",
  "uvicorn>=0.29",
  "mujoco==3.3.7",
  "gymnasium>=1.0",
  "huggingface_hub",
  "h5py>=3.0",  # imported by gap.connector (DataCollector)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/kabilankb/so101-gap"
Issues = "https://github.com/kabilankb/so101-gap/issues"
"Graph-as-Policy" = "https://github.com/graph-robots/graph-as-policy"
"SO-101 scene" = "https://huggingface.co/lerobot/so101-tabletop-mujoco"

[project.scripts]
so101-gap-run = "so101_gap.run:main"
so101-gap-generate = "so101_gap.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["so101_gap"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["scratch", "graph/color_sort/scripts/perceive_dino_vlm.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
